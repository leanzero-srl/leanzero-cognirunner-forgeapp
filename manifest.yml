modules:
  # Workflow Validator - validates on transition using AI
  jira:workflowValidator:
    - key: ai-text-field-validator
      name: CogniRunner Field Validator
      description: Validates a text field value against a custom AI prompt on workflow
        transition.
      function: validate
      resolver:
        function: resolver
      create:
        resource: config-ui-resource
      edit:
        resource: config-ui-resource
      view:
        resource: config-view-resource
      projectTypes:
        - company-managed
        - team-managed

  # Workflow Condition - controls visibility of transition based on AI
  jira:workflowCondition:
    - key: ai-text-field-condition
      name: CogniRunner Field Condition
      description: Shows transition only if a text field value passes AI validation.
      function: validate
      resolver:
        function: resolver
      expression: "true"
      create:
        resource: config-ui-resource
      edit:
        resource: config-ui-resource
      view:
        resource: config-view-resource
      projectTypes:
        - company-managed
        - team-managed

  # Workflow Post Functions - execute after transition
  jira:workflowPostFunction:
    - key: ai-semantic-post-function
      name: CogniRunner Semantic Post Function
      description: AI evaluates a condition and modifies a target field after workflow
        transition.
      function: executePostFunction
      resolver:
        function: resolver
      create:
        resource: config-ui-resource
      edit:
        resource: config-ui-resource
      view:
        resource: config-view-resource
      projectTypes:
        - company-managed
        - team-managed

    - key: ai-static-post-function
      name: CogniRunner Static Post Function
      description: Chains multiple operations with AI-generated code after workflow
        transition.
      function: executePostFunction
      resolver:
        function: resolver
      create:
        resource: config-ui-resource
      edit:
        resource: config-ui-resource
      view:
        resource: config-view-resource
      projectTypes:
        - company-managed
        - team-managed

  # Global page - shows under Apps in Jira sidebar navigation
  jira:globalPage:
    - key: cognirunner-global-page
      resource: admin-panel-resource
      title: CogniRunner
      icon: resource:icon-resource;icon.svg
      resolver:
        function: resolver

  # Admin page - Jira admin settings (guaranteed access for site admins)
  jira:adminPage:
    - key: cognirunner-admin-settings
      resource: admin-panel-resource
      title: CogniRunner Settings
      icon: resource:icon-resource;icon.svg
      resolver:
        function: resolver

  # Issue-context glance - read-only "CogniRunner on this issue" right-rail panel.
  # Shows recent validator/condition/post-function activity for the open issue. Reuses the
  # shared resolver (getIssueActivity, gated by an asUser view-check). No new scopes
  # (read:jira-work already present). Adding this module requires forge install --upgrade.
  jira:issueContext:
    - key: cognirunner-issue-glance
      resource: issue-glance-resource
      resolver:
        function: resolver
      title: CogniRunner
      label: CogniRunner
      icon: resource:icon-resource;icon.svg

  # Atlassian-hosted LLMs (Forge LLMs, Preview since 2026-06-01). Enables the
  # "Atlassian (Forge LLM)" provider: Claude models served inside the Atlassian
  # platform via @forge/llm — no API key, no egress. NOTE: adding this module is a
  # MAJOR version upgrade; existing installations must approve the update, and all
  # token usage is billed to the vendor's Forge bill (no free quota).
  llm:
    - key: cogni-llm
      model:
        - claude

  # ── LISTENERS: every Jira / Jira Software / JSM product event Forge exposes ──
  # (catalogue mirrored in src/shared/jira-events.js — keep in lockstep; the offline
  # test-harness/scripts/jira-events.test.mjs asserts it). One handler for all:
  # listeners.listenerTrigger matches the enabled Listeners (cached index read, so
  # events nobody listens to cost one KVS read) and queues matching runs on the
  # async consumer (the trigger itself is capped at 25s; runs get 120s there).
  # NOTE: avi:jira:viewed:issue fires on EVERY issue view (invocation volume).
  trigger:
    - key: listener-issue-events
      function: listener-trigger
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
        - avi:jira:deleted:issue
        - avi:jira:assigned:issue
        - avi:jira:viewed:issue
        - avi:jira:mentioned:issue
        - avi:jira:commented:issue
        - avi:jira:mentioned:comment
        - avi:jira:deleted:comment
    - key: listener-issue-child-events
      function: listener-trigger
      events:
        - avi:jira:created:worklog
        - avi:jira:updated:worklog
        - avi:jira:deleted:worklog
        - avi:jira:created:attachment
        - avi:jira:deleted:attachment
        - avi:jira:created:issuelink
        - avi:jira:deleted:issuelink
    - key: listener-project-events
      function: listener-trigger
      events:
        - avi:jira:created:project
        - avi:jira:updated:project
        - avi:jira:softdeleted:project
        - avi:jira:restored:project
        - avi:jira:deleted:project
        - avi:jira:archived:project
        - avi:jira:unarchived:project
        - avi:jira:created:version
        - avi:jira:updated:version
        - avi:jira:released:version
        - avi:jira:unreleased:version
        - avi:jira:archived:version
        - avi:jira:unarchived:version
        - avi:jira:moved:version
        - avi:jira:merged:version
        - avi:jira:deleted:version
        - avi:jira:created:component
        - avi:jira:updated:component
        - avi:jira:deleted:component
    - key: listener-software-events
      function: listener-trigger
      events:
        - avi:jira-software:created:sprint
        - avi:jira-software:started:sprint
        - avi:jira-software:updated:sprint
        - avi:jira-software:closed:sprint
        - avi:jira-software:deleted:sprint
        - avi:jira-software:created:board
        - avi:jira-software:updated:board
        - avi:jira-software:deleted:board
        - avi:jira-software:configuration-changed:board
    - key: listener-admin-events
      function: listener-trigger
      events:
        - avi:jira:created:user
        - avi:jira:updated:user
        - avi:jira:deleted:user
        - avi:jira:created:field
        - avi:jira:updated:field
        - avi:jira:trashed:field
        - avi:jira:restored:field
        - avi:jira:deleted:field
        - avi:jira:created:field:context
        - avi:jira:updated:field:context
        - avi:jira:deleted:field:context
        - avi:jira:updated:field:context:configuration
        - avi:jira:created:issuetype
        - avi:jira:updated:issuetype
        - avi:jira:deleted:issuetype
        - avi:jira:created:filter
        - avi:jira:updated:filter
        - avi:jira:deleted:filter
        - avi:jira:changed:configuration
        - avi:jira:timetracking:provider:changed
        - avi:jira:failed:expression
    - key: listener-jsm-events
      function: listener-trigger
      events:
        - avi:jsm-entity:created:request-type
        - avi:jsm-entity:updated:request-type
        - avi:jsm-entity:deleted:request-type

  # ── SCHEDULED JOBS: one 5-minute tick evaluates every job's cron (in its time
  # zone) and queues the runs that came due on the async consumer. Effective
  # granularity = 5 minutes. ──
  scheduledTrigger:
    - key: scheduled-jobs-tick
      function: scheduled-tick
      interval: fiveMinute

  # Async event consumer for long-running AI tasks
  consumer:
    - key: async-ai-consumer
      queue: async-ai-queue
      function: async-ai-handler

  # Web trigger: serves a single Jira attachment as base64 JSON behind a one-shot
  # capability token (URL token + Authorization bearer). Used by leanzero-mcp-doc-processor
  # so an LM Studio model can read Jira attachments via doc-reader's URL variant.
  # Security model documented in src/index.js (serveAttachment + mintAttachmentToken).
  webtrigger:
    # DEV-ONLY harness test-state endpoint (gated by HARNESS_SECRET; 404 in prod).
    - key: harness-test-state
      function: testStateFn
    - key: attachment-bridge
      function: serveAttachment
      response:
        type: dynamic
    # Symmetric WRITE side of attachment-bridge: doc-processor POSTs a JSON
    # envelope ({data:base64, filename, mimeType, size}) here under a one-shot
    # capability (?t=token + Authorization: Bearer <bearer>); we attach the
    # bytes to the bound issueKey via api.asApp().requestJira().
    - key: attachment-upload
      function: serveAttachmentUpload
      response:
        type: dynamic
    # RULES REST API: push / list / run Listeners and Scheduled Jobs from CI,
    # migration scripts or the test harness. Bearer API tokens minted by an app
    # admin (Settings → API access); only hashes are stored. See src/rules-api.js.
    - key: rules-api
      function: rules-api-fn
      response:
        type: dynamic

  # Lambda function for validation logic
  function:
    - key: testStateFn
      handler: index.testStateTrigger
    - key: validate
      handler: index.validate
    - key: executePostFunction
      handler: index.executePostFunction
    - key: async-ai-handler
      handler: async-handler.handler
      timeoutSeconds: 120
    - key: resolver
      handler: index.handler
    - key: serveAttachment
      handler: index.serveAttachment
    - key: serveAttachmentUpload
      handler: index.serveAttachmentUpload
    - key: listener-trigger
      handler: listeners.listenerTrigger
    - key: scheduled-tick
      handler: scheduled-jobs.scheduledTick
      timeoutSeconds: 120
    - key: rules-api-fn
      handler: rules-api.rulesApiHandler

resources:
  - key: config-ui-resource
    path: static/config-ui/build

  - key: config-view-resource
    path: static/config-view/build

  - key: admin-panel-resource
    path: static/admin-panel/build
  - key: issue-glance-resource
    path: static/issue-glance/build

  - key: icon-resource
    path: static/icons

permissions:
  content:
    styles:
      - unsafe-inline
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - read:workflow:jira
    - write:workflow:jira
    - read:project:jira
    - storage:app
    - read:issue-type-screen-scheme:jira
    - read:screen-scheme:jira
    - read:screen-tab:jira
    - manage:jira-configuration
    - read:screenable-field:jira
    - manage:jira-project
    - write:sprint:jira-software
    - write:board-scope:jira-software
    - write:issue:jira-software
  external:
    images:
      - address: "*.atlassian.net"
    fetch:
      client:
        - address: https://api.openai.com
        - address: "*.openai.azure.com"
        - address: https://openrouter.ai
        - address: https://api.anthropic.com
        # AWS Bedrock (BYOK): Converse runtime (inference) at bedrock-runtime.<region>.amazonaws.com
        # + control plane (model listing) at bedrock.<region>.amazonaws.com. Forge egress wildcards
        # are leftmost-only (no mid-segment '*'), and a single '*' matches nested subdomains (same as
        # '*.ts.net' above), so one wildcard covers both Bedrock hosts across every region selected.
        - address: "*.amazonaws.com"
        # Hosted MCP servers exposed via Tailscale Funnel (LM Studio + the
        # cross-provider bridge). Forge runtime egress follows CSP and only
        # honors the DEFAULT HTTPS port (443) — non-standard ports (8443/10000)
        # are blocked at runtime even if listed, so self-hosted MCPs MUST be
        # served on Funnel port 443. This wildcard matches nested *.ts.net hosts.
        - address: "*.ts.net"
        # context7 hosted MCP (library/SDK docs)
        - address: https://mcp.context7.com
      backend:
        - address: https://api.openai.com
        - address: "*.openai.azure.com"
        - address: https://openrouter.ai
        - address: https://api.anthropic.com
        # AWS Bedrock (BYOK): Converse runtime (inference) at bedrock-runtime.<region>.amazonaws.com
        # + control plane (model listing) at bedrock.<region>.amazonaws.com. Forge egress wildcards
        # are leftmost-only (no mid-segment '*'), and a single '*' matches nested subdomains (same as
        # '*.ts.net' above), so one wildcard covers both Bedrock hosts across every region selected.
        - address: "*.amazonaws.com"
        # Hosted MCP servers exposed via Tailscale Funnel (LM Studio + the
        # cross-provider bridge). Forge runtime egress follows CSP and only
        # honors the DEFAULT HTTPS port (443) — non-standard ports (8443/10000)
        # are blocked at runtime even if listed, so self-hosted MCPs MUST be
        # served on Funnel port 443. This wildcard matches nested *.ts.net hosts.
        - address: "*.ts.net"
        # context7 hosted MCP (library/SDK docs)
        - address: https://mcp.context7.com

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/36415848-6868-4697-9554-3c3ad87b8da9
  licensing:
    enabled: true
