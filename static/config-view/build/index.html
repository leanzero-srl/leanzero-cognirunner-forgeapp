<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CogniRunner View</title><style>:root {
                --bg-color: transparent;
                --text-color: #0f172a;
                --text-secondary: #64748b;
                --text-muted: #94a3b8;
                --primary-color: #2563eb;
                --code-bg: #f1f5f9;
                --success-color: #16a34a;
                --error-color: #dc2626;
                --border-color: #cbd5e1;
                --card-bg: #ffffff;
            }
            html[data-color-mode="dark"] {
                --bg-color: transparent;
                --text-color: #F5F5F7;
                --text-secondary: #A0A0B0;
                --text-muted: #71717a;
                --primary-color: #3b82f6;
                --code-bg: #0A0A0F;
                --success-color: #22c55e;
                --error-color: #ef4444;
                --border-color: #334155;
                --card-bg: #13131A;
            }
            *, *::before, *::after { box-sizing: border-box; }
            html, body {
                margin: 0; padding: 0;
                font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                background: var(--bg-color);
                color: var(--text-color);
                font-size: 13px; line-height: 1.4;
            }
            #root { min-height: 100%; }
            .loading-text { font-size: 12px; color: var(--text-muted); }
            /* Pre-mount skeleton shimmer — injectStyles() lands post-mount,
               so the first paint of .sk placeholders needs this here. */
            .sk {
                background: linear-gradient(90deg, #cbd5e1 25%, #f1f5f9 50%, #cbd5e1 75%);
                background-size: 200% 100%;
                animation: skShimmer 1.5s ease-in-out infinite;
                border-radius: 6px;
            }
            html[data-color-mode="dark"] .sk {
                background: linear-gradient(90deg, #1e1e2e 25%, #2a2a3a 50%, #1e1e2e 75%);
                background-size: 200% 100%;
            }
            @media (prefers-color-scheme: dark) {
                html:not([data-color-mode="light"]) .sk {
                    background: linear-gradient(90deg, #1e1e2e 25%, #2a2a3a 50%, #1e1e2e 75%);
                    background-size: 200% 100%;
                }
            }
            @keyframes skShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }</style><script defer="defer" src="./bundle.daf4f4a3.js"></script></head><body><div id="root"></div></body></html>
