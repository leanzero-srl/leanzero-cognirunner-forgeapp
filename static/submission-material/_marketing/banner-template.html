<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CogniRunner Banner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1120px; height: 548px; overflow: hidden; color: #fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:
      radial-gradient(900px 600px at 80% 40%, rgba(38,132,255,0.16) 0%, transparent 60%),
      linear-gradient(160deg, #0C1626 0%, #080E1A 55%, #070B14 100%);
  }
  .b { position: relative; width: 1120px; height: 548px; display: flex; align-items: center; }
  .b::before { content:''; position:absolute; inset:0; background-image: radial-gradient(circle, rgba(120,160,220,0.06) 1.5px, transparent 1.5px); background-size: 30px 30px; }
  .left { position: relative; z-index: 3; width: 520px; min-width: 520px; padding: 0 0 0 64px; }
  .brandrow { display:flex; align-items:center; gap:14px; margin-bottom: 26px; }
  .logo { width: 56px; height: 56px; border-radius: 15px; background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.10); display:flex; align-items:center; justify-content:center; }
  .logo svg { width: 34px; height: 34px; }
  .name { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; }
  .tag { font-size: 22px; font-weight: 700; color:#fff; line-height: 1.25; margin-bottom: 22px; max-width: 420px; letter-spacing:-0.3px; }
  .tag em { color:#4C9AFF; font-style: normal; }
  .feats { display:flex; flex-direction:column; gap:11px; margin-bottom: 26px; }
  .feat { display:flex; align-items:center; gap:11px; font-size:15px; font-weight:500; color:#A9BCD6; }
  .dot { width:7px; height:7px; border-radius:50%; background:#2684FF; box-shadow:0 0 10px #2684FF; }
  .badges { display:flex; gap:10px; }
  .badge { display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.10); font-size:12.5px; font-weight:600; color:#8FA6C4; }
  .badge svg { width:14px; height:14px; }
  .right { position:relative; z-index:2; flex:1; height:100%; display:flex; align-items:center; justify-content:center; }
  .glow { position:absolute; width:520px; height:520px; border-radius:50%; background: radial-gradient(circle, rgba(38,132,255,0.20) 0%, transparent 62%); }
  .window { position:relative; width: 620px; height: 430px; border-radius:14px; overflow:hidden; background:#fff;
    box-shadow: 0 8px 24px rgba(0,0,0,0.30), 0 30px 70px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06);
    transform: perspective(1800px) rotateY(-8deg) rotateX(2deg) translateX(10px); }
  .winbar { height:38px; background:#1b2433; display:flex; align-items:center; gap:7px; padding:0 14px; }
  .winbar i { width:11px; height:11px; border-radius:50%; } .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .url { margin-left:14px; flex:1; height:22px; border-radius:6px; background:#0f1622; color:#6f8198; font-size:12px; display:flex; align-items:center; padding:0 12px; }
  .shot { width:100%; height: calc(430px - 38px); overflow:hidden; background:#f1f2f4; }
  .shot img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
</style>
</head>
<body>
<div class="b">
  <div class="left">
    <div class="brandrow">
      <div class="logo">
        <svg viewBox="0 0 128 128" fill="none">
          <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0065FF"/><stop offset="100%" style="stop-color:#4C9AFF"/></linearGradient></defs>
          <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#g)"/>
          <path d="M44 42C44 34 52 28 58 28C62 28 64 30 64 34L64 64" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <path d="M38 52C32 52 28 58 28 64C28 72 34 78 42 78L64 78" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <path d="M84 42C84 34 76 28 70 28C66 28 64 30 64 34" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <path d="M90 52C96 52 100 58 100 64C100 72 94 78 86 78L64 78" stroke="white" stroke-width="5" stroke-linecap="round"/>
          <circle cx="64" cy="58" r="10" stroke="white" stroke-width="4"/><circle cx="64" cy="58" r="4" fill="white"/>
          <path d="M56 92L72 92L72 86L88 96L72 106L72 100L56 100Z" fill="white" opacity="0.95"/>
        </svg>
      </div>
      <div class="name">CogniRunner</div>
    </div>
    <div class="tag">AI workflow automation for Jira — <em>validate, decide & act</em></div>
    <div class="feats">
      <div class="feat"><span class="dot"></span>Validators, conditions & AI post-functions</div>
      <div class="feat"><span class="dot"></span>Agentic duplicate detection & attachment analysis</div>
      <div class="feat"><span class="dot"></span>Bring your own AI key — OpenAI, Anthropic, Azure & more</div>
    </div>
    <div class="badges">
      <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>Built on Atlassian Forge</div>
      <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><path d="M8 12l3 3 5-6"/></svg>Open Source (Apache-2.0)</div>
    </div>
  </div>
  <div class="right">
    <div class="glow"></div>
    <div class="window">
      <div class="winbar"><i class="r"></i><i class="y"></i><i class="g"></i><div class="url" id="url">your-site.atlassian.net</div></div>
      <div class="shot"><img id="shot" alt="" /></div>
    </div>
  </div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  if (p.get('img')) document.getElementById('shot').src = p.get('img');
  if (p.get('url')) document.getElementById('url').textContent = p.get('url');
</script>
</body>
</html>
